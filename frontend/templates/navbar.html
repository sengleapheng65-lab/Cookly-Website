<header class="navbar">
  <nav class="navbar_container">
    <!-- Cookly Brand & Logo -->
    <a href="{{ url_for('home') }}" class="cookly_brand">
      <span id="nav_logo">
        <span class="logo_egg"></span>
      </span>
      Cookly
    </a>

    <!-- Navigation Links -->
    <ul class="navbar_menu" id="navbarMenu">
      <li class="item">
        <a href="{{ url_for('home') }}" class="nav_link {% if request.endpoint == 'home' %}active{% endif %}">Home</a>
      </li>

      <li class="item">
        <a href="{{ url_for('browse') }}" class="nav_link {% if request.endpoint == 'browse' %}active{% endif %}">Browse Recipes</a>
      </li>

      <li class="item">
        <a href="{{ url_for('add_recipe') }}" class="nav_link {% if request.endpoint == 'add_recipe' %}active{% endif %}">Add Recipe</a>
      </li>

      {% if session.get('user_id') %}
      <!-- Authenticated Links -->
      <li class="item">
        <a href="{{ url_for('collections') }}" class="nav_link {% if request.endpoint == 'collections' %}active{% endif %}">Collections</a>
      </li>
      <li class="item">
        <a href="{{ url_for('profile') }}" class="nav_link {% if request.endpoint == 'profile' %}active{% endif %}">My Profile</a>
      </li>
      <li class="item">
        <a href="{{ url_for('logout') }}" class="nav_button">Log Out</a>
      </li>
      {% else %}
      <!-- Guest Link -->
      <li class="item">
        <a href="{{ url_for('login') }}" class="nav_button">Sign In</a>
      </li>
      {% endif %}
    </ul>

    <!-- Mobile Hamburger Toggle -->
    <button
      class="navbar_toggle"
      id="navbarToggle"
      aria-label="Toggle Navigation"
      aria-controls="navbarMenu"
      aria-expanded="false"
    >
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </nav>
</header>
