<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password - Cookly</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/Navbar.css') }}" />
    <script src="{{ url_for('static', filename='js/navbar.js') }}" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: #fbf7ef; color: #26342d; font-family: "DM Sans", sans-serif; }
      .password-page { max-width: 620px; margin: 64px auto; padding: 0 24px 80px; }
      .password-page h1 { color: #174532; font-family: "Fraunces", serif; font-size: 3.2rem; }
      .password-card { padding: 36px; background: #fff; border: 1px solid #e7dfd3; border-radius: 22px; box-shadow: 0 12px 28px rgba(38, 52, 45, .08); }
      .password-field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
      .password-field label { color: #174532; font-weight: 700; }
      .password-field input { padding: 14px 15px; border: 1px solid #e7dfd3; border-radius: 11px; background: #fdfcf9; font: inherit; }
      .password-actions { display: flex; gap: 14px; margin-top: 28px; }
      .password-actions button, .password-actions a { padding: 13px 18px; border: 0; border-radius: 10px; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
      .password-actions button { color: #fff; background: #1f5c42; }
      .password-actions a { color: #1f5c42; background: #eef5f0; }
      .password-page { max-width: 980px; margin: 0 auto; padding: 76px 28px 96px; }
      .settings-heading { margin: 0 auto 38px; text-align: center; }
      .settings-heading .section-label { margin-bottom: 10px; color: #e97b39; font-size: .78rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
      .settings-heading h1 { margin: 0 0 12px; color: #174532; font-family: "Fraunces", serif; font-size: clamp(2.8rem, 5vw, 4.5rem); letter-spacing: -.06em; }
      .settings-heading p { color: #6f7b74; }
      .password-card { max-width: 620px; margin: 0 auto; padding: 42px; border-radius: 24px; }
      @media (max-width: 650px) { .password-card { padding: 26px 22px; } }
    </style>
  </head>
  <body>
    {% include 'navbar.html' %}
    <main class="password-page">
      <div class="settings-heading">
        <p class="section-label">Account security</p>
        <h1>Change password</h1>
        <p>Use a strong password to keep your Cookly account secure.</p>
      </div>
      <form class="password-card" method="POST">
        <div class="password-field">
          <label for="currentPassword">Current password</label>
          <input id="currentPassword" name="currentPassword" type="password" required />
        </div>
        <div class="password-field">
          <label for="newPassword">New password</label>
          <input id="newPassword" name="newPassword" type="password" minlength="8" required />
        </div>
        <div class="password-field">
          <label for="confirmPassword">Confirm new password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" required />
        </div>
        <div class="password-actions">
          <button type="submit">Update password</button>
          <a href="{{ url_for('profile') }}">Cancel</a>
        </div>
      </form>
    </main>
  </body>
</html>
