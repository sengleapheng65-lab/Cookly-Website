<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Profile - Cookly</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/Navbar.css') }}" />
    <script src="{{ url_for('static', filename='js/navbar.js') }}" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: #fbf7ef; color: #26342d; font-family: "DM Sans", sans-serif; }
      .profile-edit-page { max-width: 720px; margin: 64px auto; padding: 0 24px 80px; }
      .profile-edit-page h1 { margin-bottom: 28px; color: #174532; font-family: "Fraunces", serif; font-size: 3.4rem; }
      .profile-edit-card { padding: 36px; background: #fff; border: 1px solid #e7dfd3; border-radius: 22px; box-shadow: 0 12px 28px rgba(38, 52, 45, .08); }
      .profile-field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
      .profile-field label { color: #174532; font-weight: 700; }
      .profile-field input { padding: 14px 15px; border: 1px solid #e7dfd3; border-radius: 11px; background: #fdfcf9; font: inherit; }
      .profile-actions { display: flex; align-items: center; gap: 14px; margin-top: 28px; }
      .profile-actions button, .profile-actions a { padding: 13px 18px; border: 0; border-radius: 10px; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
      .profile-actions button { color: #fff; background: #1f5c42; }
      .profile-actions a { color: #1f5c42; background: #eef5f0; }
      .profile-photo-field { display: flex; align-items: center; gap: 18px; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid #e7dfd3; }
      .profile-photo-preview { width: 78px; height: 78px; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border-radius: 50%; color: #fff; background: #1f5c42; font-family: "Fraunces", serif; font-size: 2rem; }
      .profile-photo-preview img { width: 100%; height: 100%; object-fit: cover; }
      .profile-photo-field label { display: block; margin-bottom: 8px; color: #174532; font-weight: 700; }
      .profile-photo-field input { display: block; font: inherit; }
      .profile-photo-field small { display: block; margin-top: 7px; color: #6f7b74; }
      .profile-edit-page { max-width: 980px; margin: 0 auto; padding: 76px 28px 96px; }
      .settings-heading { margin: 0 auto 38px; text-align: center; }
      .settings-heading .section-label { margin-bottom: 10px; color: #e97b39; font-size: .78rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
      .settings-heading h1 { margin: 0 0 12px; font-size: clamp(2.8rem, 5vw, 4.5rem); letter-spacing: -.06em; }
      .settings-heading p:last-child { color: #6f7b74; font-size: 1rem; }
      .profile-edit-card { max-width: 820px; margin: 0 auto; padding: 42px; border-radius: 24px; }
      .profile-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
      .profile-actions { padding-top: 8px; }
      @media (max-width: 650px) { .profile-fields { grid-template-columns: 1fr; } .profile-edit-card { padding: 26px 22px; } }
    </style>
  </head>
  <body>
    {% include 'navbar.html' %}
    <main class="profile-edit-page">
      <div class="settings-heading">
        <p class="section-label">Account settings</p>
        <h1>Edit your profile</h1>
        <p>Keep your Cookly account information up to date.</p>
      </div>
      <form class="profile-edit-card" method="POST" enctype="multipart/form-data">
        <div class="profile-photo-field">
          <div class="profile-photo-preview">
            {% if user.profile_image_filename %}
            <img src="{{ url_for('static', filename='uploads/' ~ user.profile_image_filename) }}" alt="Current profile picture" />
            {% else %}
            {{ user.full_name[0] | upper }}
            {% endif %}
          </div>
          <div>
            <label for="profileImage">Profile picture</label>
            <input id="profileImage" name="profileImage" type="file" accept="image/*" />
            <small>JPG, PNG, GIF, or WEBP · maximum 5 MB</small>
          </div>
        </div>
        <div class="profile-fields">
        <div class="profile-field">
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" value="{{ user.full_name }}" required />
        </div>
        <div class="profile-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" value="{{ user.email }}" required />
        </div>
        </div>
        <div class="profile-actions">
          <button type="submit">Save changes</button>
          <a href="{{ url_for('profile') }}">Cancel</a>
        </div>
      </form>
      <p style="margin-top: 20px; text-align: center">
        <a href="{{ url_for('change_password') }}" style="color: #1f5c42; font-weight: 700">Change password</a>
      </p>
    </main>
  </body>
</html>
