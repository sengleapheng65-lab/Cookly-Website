<!doctype html>
<html lang="en">
  <head>

    <meta

      content="Cookly is a recipe-sharing platform for home cooks."
    />

    <title>Cookly | Recipe Sharing</title>

    <!-- Bootstrap CSS -->

    <link rel="stylesheet" href="../static/css/style.css" />
  </head>

  <body>
    <!-- Navigation bar -->
    <header>
      <nav class="navbar navbar-expand-lg cookly-navbar">
        <div class="container">

          <a class="navbar-brand cookly-logo" href="#">Cookly</a>

          <!-- Mobile navigation button -->
          <button
            class="navbar-toggler"

            data-bs-toggle="collapse"

              <li class="nav-item">
                <a class="nav-link" href="#">My Collections</a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="#">Login</a>
              </li>

              <li class="nav-item">
                <a class="register-button" href="#">Register</a>
              </li>
            </ul>
          </div>
        </div>

    <!-- Temporary page content -->
    <main class="container page-content">
      <h1>Cookly</h1>

      <p>Discover, share, and save delicious recipes.</p>
